<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EthixWeb — Digital Operations, Web Development & AI Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="main-container">
    <!-- Hero Section -->
    <section class="hero">
      <!-- Preloader -->
      <div class="pre-loader">
        <div class="preloader-content">
          <div class="preloader-row">
            <p class="loading-text">Loading</p>
            <div class="counter clip-counter">
              <div class="digit-1">
                <div class="num">0</div>
                <div class="num">1</div>
              </div>
              <div class="digit-2">
                <div class="num">0</div>
                <div class="num">1</div>
                <div class="num">2</div>
                <div class="num">3</div>
                <div class="num">4</div>
                <div class="num">5</div>
                <div class="num">6</div>
                <div class="num">7</div>
                <div class="num">8</div>
                <div class="num">9</div>
                <div class="num">0</div>
              </div>
              <div class="digit-3">
                <div class="num">0</div><div class="num">1</div><div class="num">2</div><div class="num">3</div><div class="num">4</div><div class="num">5</div><div class="num">6</div><div class="num">7</div><div class="num">8</div><div class="num">9</div>
                <div class="num">0</div><div class="num">1</div><div class="num">2</div><div class="num">3</div><div class="num">4</div><div class="num">5</div><div class="num">6</div><div class="num">7</div><div class="num">8</div><div class="num">9</div>
                <div class="num">0</div><div class="num">1</div><div class="num">2</div><div class="num">3</div><div class="num">4</div><div class="num">5</div><div class="num">6</div><div class="num">7</div><div class="num">8</div><div class="num">9</div>
                <div class="num">0</div>
              </div>
            </div>
          </div>
          <div class="progress-bar-track">
            <div class="progress-bar"></div>
          </div>
        </div>
      </div>

      <!-- Hero Images -->
      <div class="hero-imgs">
        <div class="hero-img clip-image-hidden"><img src="/assets/Batman_4K_Wallpaper_Dark_Knight_Red_Neon_Ultra_HD_Background.jpg" alt="Hero 1"></div>
        <div class="hero-img clip-image-hidden"><img src="/assets/4K_Ethereal_Angel_Girl_with_Halo_Wallpaper.jpg" alt="Hero 2"></div>
        <div class="hero-img clip-image-hidden"><img src="/assets/Battlefield_2042_Soldier_4K_Wallpaper_Orange_Explosion_Aesthetic.jpg" alt="Hero 3"></div>
      </div>
    </section>

    <!-- Website Content -->
    <div class="website-content">
      <nav>
        <div class="nav-left">Logo</div>
        <div class="nav-center">Photographer, Creative Director, Filmmaker</div>
        <div class="nav-right">Menu</div>
      </nav>
      <div class="header">
        <h1 class="title">
          <span class="char-span">H</span>
          <span class="char-span">O</span>
          <span class="char-span">W</span>
          <span class="char-span">A</span>
          <span class="char-span">R</span>
          <span class="char-span">D</span>
        </h1>
      </div>
    </div>
  </main>

  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
